[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/chat",
    "crates/responses",
    "crates/anthropic",
    "crates/xlate",
    "crates/e2e",
    "crates/testrouter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
llm-xlate-core = { path = "crates/core" }
llm-xlate-chat = { path = "crates/chat" }
llm-xlate-responses = { path = "crates/responses" }
llm-xlate-anthropic = { path = "crates/anthropic" }
llm-xlate = { path = "crates/xlate" }
llm-xlate-e2e = { path = "crates/e2e" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
bytes = { version = "1", features = ["serde"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
regex = "1"
toml = "0.8"
thiserror = "2"
http = "1"
indexmap = { version = "2", features = ["serde"] }

proptest = "1"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"

# e2e binary crate deps (not used by the sans-IO library crates)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
glob = "0.3"

# testrouter (I/O shell) deps
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
http-body-util = "0.1"

[profile.dev]
opt-level = 0
[profile.test]
opt-level = 1
