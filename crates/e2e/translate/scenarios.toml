[[scenario]]
name    = "thinking_replay"
kind    = "thinking_replay"
source  = "anthropic"
request = "../xlate/tests/golden/anthropic/tools_thinking.req.json"
notes   = "Thinking + tool_use replay; thinking blocks lower to a reasoning envelope on OpenAI targets."

[[scenario]]
name    = "structured_strict"
kind    = "structured_strict"
source  = "anthropic"
request = "../xlate/tests/golden/anthropic/structured.req.json"
notes   = "output_config.format json_schema -> response_format / text.format."

[[scenario]]
name    = "media"
kind    = "media"
source  = "anthropic"
