protocol   = "anthropic"
tags       = ["explore", "dataset", "cache", "cache_accounting"]
models     = "anthropic_new"
stream     = false
after      = []
hypothesis = "A system block above the minimum cacheable size reports usage.cache_creation_input_tokens > 0 on the first call, all of it in cache_creation.ephemeral_5m_input_tokens."
expect     = { status = 200 }
notes      = "The cold half of the pair, and the first dataset capture carrying a non-zero cache WRITE. Confirmed live: 3935 written, input_tokens 15."

