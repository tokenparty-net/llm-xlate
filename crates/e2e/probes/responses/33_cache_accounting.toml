# Cache-accounting family — prompts genuinely large enough to create and read a provider cache.
#
# The `01_cache_control` / `21_compat` families exercise the *request-side* cache_control plumbing,
# but their padded system blocks sit well below every provider's minimum cacheable prefix, so every
# capture in `dataset/` held zero in every cache counter and nothing in the suite had ever
# translated a non-zero one.
#
# These probes fix that. Each pair sends the same oversized prompt twice in one run — cold, then
# warm — so a single run yields both a cache *write* and a cache *read* to capture. The shared
# prefix is ~3824 tokens, clearing Anthropic's 2048-token Haiku minimum and OpenAI's 1024-token
# automatic-caching threshold with room to spare.
#
# The 1-hour probes deliberately use a policy text that differs from the 5-minute one at its first
# token: Anthropic matches cache entries by prefix, so a body identical apart from `ttl` reads the
# existing 5-minute entry rather than writing a 1-hour one (observed on run 20260912-071653).
#
# Cache hits are best-effort by nature: a cold run, an evicted entry or a routing change can leave
# a read probe reporting zero. The observation is recorded either way, so `expect` stays at
# `status = 200` rather than asserting a counter.

[[probe]]
id         = "resp.cacheacct.write"
protocol   = "responses"
tags       = ["explore", "dataset", "cache", "cache_accounting"]
models     = "openai_responses"
stream     = false
after      = []
hypothesis = "The Responses dialect carries input_tokens_details.cache_write_tokens, OpenAI's own cache-write spelling, on every call."
expect     = { status = 200 }
notes      = "Confirms the spelling exists natively. Confirmed live: present and 0 even on a cold call, so OpenAI reports the field but never bills a write through it."

