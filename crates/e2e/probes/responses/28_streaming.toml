# Responses family 28 — streaming event sequences (plan §5.28).
# llm-xlate assumption: §8 streaming codecs — full event sequence for text / tool call / reasoning summary /
# refusal; sequence_number continuity; output_item.done payloads; response.incomplete for max_output_tokens.
# Raw SSE fixtures for the Responses stream decoder.

[[probe]]
id         = "resp.stream.text"
protocol   = "responses"
tags       = ["dataset", "streaming"]
models     = "openai_responses"
stream     = true
hypothesis = "A text stream emits response.created -> output_item.added -> content_part.added -> output_text.delta* -> output_text.done -> content_part.done -> output_item.done -> response.completed, with contiguous sequence_number."
expect     = { status = 200 }
notes      = "Baseline Responses SSE fixture; observe sequence_number continuity and output_item.done payload."

[probe.body]
model             = "$MODEL"
max_output_tokens = 128
input             = "Count one to five."

[[probe]]
id         = "resp.stream.tool_call"
protocol   = "responses"
tags       = ["dataset", "streaming", "tools"]
models     = "openai_responses"
stream     = true
hypothesis = "A tool-call stream emits function_call_arguments.delta chunks that accumulate to the arguments and an output_item.done carrying the full function_call."
expect     = { status = 200 }

[probe.body]
model             = "$MODEL"
max_output_tokens = 128
tools             = [ { type = "function", name = "get_weather", description = "Get weather.", parameters = { type = "object", properties = { city = { type = "string" } }, required = ["city"], additionalProperties = false } } ]
input             = "Weather in Paris? Use the tool."

[[probe]]
id         = "resp.stream.reasoning_summary"
protocol   = "responses"
tags       = ["dataset", "streaming", "reasoning"]
models     = "openai_reasoning"
stream     = true
hypothesis = "A reasoning stream emits reasoning_summary_part.added and reasoning_summary_text.delta events (possibly multi-part) before the message item."
expect     = "any"

[probe.body]
model             = "$MODEL"
max_output_tokens = 512
reasoning         = { effort = "medium", summary = "auto" }
input             = "What is 17*23? Think, then answer."

[[probe]]
id         = "resp.stream.incomplete"
protocol   = "responses"
tags       = ["dataset", "streaming"]
models     = "openai_responses"
stream     = true
hypothesis = "A tiny max_output_tokens yields a terminal response.incomplete event with incomplete_details.reason=max_output_tokens."
expect     = { status = 200 }

[probe.body]
model             = "$MODEL"
max_output_tokens = 16
input             = "Write a 300-word essay about rivers."

[[probe]]
id         = "resp.stream.refusal"
protocol   = "responses"
tags       = ["streaming", "errors"]
models     = "openai_responses"
stream     = true
requires   = ["manual"]
hypothesis = "A refused prompt emits a refusal content part / refusal.delta events."
expect     = "any"
notes      = "requires manual: not automated with disallowed content; operator triggers deliberately."

[probe.body]
model             = "$MODEL"
max_output_tokens = 64
input             = "Say hi."
